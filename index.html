<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Oficial - Timpulso</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        h2 { color: #2ecc71; font-size: 1.5rem; }
        .selector-tipo { background: #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #555; font-size: 16px; width: 90%; max-width: 400px; cursor: pointer; }
        .mapa-scroll { width: 100%; overflow-x: auto; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }
        .grid-base { display: grid; grid-template-columns: 30px repeat(7, 35px) 50px repeat(7, 35px); justify-content: center; gap: 3px; min-width: 580px; }
        .escenario-container { margin: 20px 0 10px 0; }
        .escenario { grid-column: 2 / 17; background: #444; padding: 10px 0; border-radius: 8px; font-weight: bold; font-size: 14px; letter-spacing: 2px; border-bottom: 3px solid #2ecc71; }
        .fila { margin: 4px 0; align-items: center; }
        .letra { font-weight: bold; text-align: center; color: #888; font-size: 12px; }
        .asiento { width: 32px; height: 32px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .vip { background: gold; color: black; }
        .seleccionado { background: #ff4757 !important; color: white !important; box-shadow: 0 0 10px #ff4757; }
        .ocupado { background: #333 !important; color: #555 !important; cursor: not-allowed; }
        .general-panel { width: 90%; max-width: 280px; background: #2ecc71; margin: 20px auto; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-around; color: black; font-weight: bold; font-size: 22px; }
        .btn-qty { width: 45px; height: 45px; font-size: 24px; cursor: pointer; border: none; border-radius: 50%; background: white; font-weight: bold; }
        .btn-confirmar { width: 90%; max-width: 350px; padding: 15px; font-size: 18px; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 50px; margin: 20px 0; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: #222; margin: 15% auto; padding: 25px; border: 1px solid #2ecc71; width: 85%; max-width: 320px; border-radius: 15px; text-align: left; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; font-size: 16px; }
        .btn-reg { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .seccion-recuperar { margin: 50px auto 30px auto; padding: 20px; border-top: 1px solid #333; background: #1a1a1a; max-width: 500px; border-radius: 15px; }
        .input-busqueda { padding: 10px; border-radius: 5px; border: 1px solid #2ecc71; background: #000; color: white; width: 180px; text-align: center; font-size: 16px; }
        .ticket-card { background:#333; padding:15px; margin:10px 0; border-radius:8px; border-left:4px solid #2ecc71; text-align:left; font-size:13px; }
    </style>
</head>
<body>

    <h2>Venta de Entradas - Timpulso</h2>

    <select id="tipoEntrada" class="selector-tipo" onchange="cambiarTipo()">
        <option value="VIP">Zona VIP (Numerada)</option>
        <option value="GENERAL">Zona General</option>
    </select>

    <div id="contenedorVIP">
        <div class="mapa-scroll">
            <div class="escenario-container grid-base">
                <div></div>
                <div class="escenario">ESCENARIO</div>
            </div>
            <div id="mapaVIP">Sincronizando datos...</div>
        </div>
        <p style="font-size: 11px; color: #666;">← Desliza lateralmente para ver todos los asientos →</p>
    </div>

    <div id="contenedorGeneral" style="display:none;">
        <div class="general-panel">
            <button class="btn-qty" onclick="modificarGeneral(-1)">−</button>
            <span id="contadorGeneral">0</span>
            <button class="btn-qty" onclick="modificarGeneral(1)">+</button>
        </div>
        <p>Entradas Generales seleccionadas</p>
    </div>

    <button id="btnFinalizar" class="btn-confirmar" onclick="abrirRegistro()">Confirmar y Descargar</button>

    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h3 style="color:#2ecc71; text-align:center; margin-top:0;">Registro de Venta</h3>
            <input type="text" id="cNombre" placeholder="Nombre completo">
            <input type="text" id="cDNI" placeholder="DNI" inputmode="numeric">
            <input type="text" id="cCel" placeholder="Celular" inputmode="tel">
            <button id="btnEjecutar" class="btn-reg" onclick="validarYProcesar()">Finalizar Venta</button>
            <button class="btn-reg" style="background:#555; margin-top:8px;" onclick="cerrarRegistro()">Cancelar</button>
        </div>
    </div>

    <div class="seccion-recuperar">
        <h3 style="color:#2ecc71; margin-top:0;">🔍 Recuperar Tickets</h3>
        <div style="display:flex; justify-content:center; gap:8px;">
            <input type="text" id="dniBusqueda" class="input-busqueda" placeholder="Ingresa DNI">
            <button onclick="buscarYReimprimir()" style="padding:10px 15px; background:#2ecc71; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Buscar</button>
        </div>
        <div id="resultadoBusqueda"></div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const URL_APP = "https://script.google.com/macros/s/AKfycbzO_-ll5SSczfl0GczbqRykfN6kgvYeSosiZqIFUrUHm9S2Fda6hD6cnk8a-Ug-fVAY/exec"; 
        
        const filasVIP = ["A", "B", "C", "D", "E", "F", "G"];
        let pedido = { vip: [], general: 0 };
        let asientosOcupados = [];
        let correlativoProximo = 1;

        // --- PUNTO 1: LIMPIEZA AUTOMÁTICA DEL BUSCADOR ---
        document.getElementById("dniBusqueda").addEventListener("input", function() {
            if (this.value.trim() === "") {
                document.getElementById("resultadoBusqueda").innerHTML = "";
            }
        });

        async function cargarDatos() {
            try {
                const cb = "?t=" + Date.now();
                const resC = await fetch(URL_APP + "?getCorrelativo=true" + cb);
                correlativoProximo = parseInt(await resC.text()) || 1;
                const resM = await fetch(URL_APP + cb);
                asientosOcupados = await resM.json();
                crearMapa();
            } catch (e) { 
                console.error(e);
                document.getElementById("mapaVIP").innerText = "Error de conexión con Google Sheets."; 
            }
        }

        function crearMapa() {
            const mapa = document.getElementById("mapaVIP");
            mapa.innerHTML = "";
            filasVIP.forEach(fila => {
                const filaDiv = document.createElement("div");
                filaDiv.className = "fila grid-base";
                const letra = document.createElement("div");
                letra.className = "letra"; letra.innerText = fila;
                filaDiv.appendChild(letra);
                let cantidad = (fila === "A" || fila === "B" || fila === "C") ? 13 : 14;
                if (cantidad === 13) filaDiv.appendChild(document.createElement("div"));
                for (let i = cantidad; i >= 1; i--) {
                    const id = `${fila}-${i}`;
                    const asiento = document.createElement("div");
                    const estaOcupado = asientosOcupados.includes(id);
                    asiento.className = "asiento vip" + (estaOcupado ? " ocupado" : "");
                    asiento.innerText = i;
                    if (!estaOcupado) asiento.onclick = () => toggleAsiento(id, asiento);
                    filaDiv.appendChild(asiento);
                }
                mapa.appendChild(filaDiv);
            });
        }

        function toggleAsiento(id, el) {
            const idx = pedido.vip.indexOf(id);
            if (idx > -1) {
                pedido.vip.splice(idx, 1);
                el.classList.remove("seleccionado");
            } else {
                pedido.vip.push(id);
                el.classList.add("seleccionado");
            }
        }

        function modificarGeneral(v) {
            pedido.general = Math.max(0, pedido.general + v);
            document.getElementById("contadorGeneral").innerText = pedido.general;
        }

        function cambiarTipo() {
            const t = document.getElementById("tipoEntrada").value;
            document.getElementById("contenedorVIP").style.display = t === "VIP" ? "block" : "none";
            document.getElementById("contenedorGeneral").style.display = t === "GENERAL" ? "block" : "none";
        }

        function abrirRegistro() {
            if (pedido.vip.length + pedido.general === 0) return alert("Por favor, selecciona al menos una entrada.");
            document.getElementById("modalRegistro").style.display = "block";
        }

        function cerrarRegistro() { document.getElementById("modalRegistro").style.display = "none"; }

        async function validarYProcesar() {
            const nom = document.getElementById("cNombre").value.trim();
            const dni = document.getElementById("cDNI").value.trim();
            const cel = document.getElementById("cCel").value.trim();
            if (!nom || !dni || !cel) return alert("Por favor, completa todos los campos del cliente.");

            document.getElementById("btnEjecutar").disabled = true;
            document.getElementById("btnEjecutar").innerText = "Procesando...";

            // --- PUNTO 2: DETERMINAR CATEGORÍA EXACTA ---
            let tipoFinal = "";
            if (pedido.vip.length > 0 && pedido.general > 0) {
                tipoFinal = "MIXTA";
            } else if (pedido.vip.length > 0) {
                tipoFinal = "VIP";
            } else {
                tipoFinal = "GENERAL";
            }

            const total = pedido.vip.length + pedido.general;
            const inicio = correlativoProximo;
            const fin = correlativoProximo + (total - 1);

            const formData = new URLSearchParams();
            formData.append('nroVenta', Date.now().toString().slice(-6));
            formData.append('nombre', nom);
            formData.append('dni', dni);
            formData.append('celular', cel);
            formData.append('asientos', [...pedido.vip, ...(pedido.general > 0 ? ["GENERAL (" + pedido.general + ")"] : [])].join(", "));
            formData.append('tipo', tipoFinal); // Envía MIXTA, VIP o GENERAL
            formData.append('correlativoInicio', inicio);
            formData.append('correlativoFin', fin);

            try {
                // Envío a Google Sheets
                await fetch(URL_APP, { method: "POST", mode: "no-cors", body: formData });
                
                // Generación de Tickets
                let curr = inicio;
                for (let a of pedido.vip) {
                    await generarTicket("vip.jpg", String(curr).padStart(5, "0"), a);
                    curr++;
                }
                for (let i = 0; i < pedido.general; i++) {
                    await generarTicket("general.jpg", String(curr).padStart(5, "0"), "GENERAL");
                    curr++;
                }

                alert("Venta registrada con éxito como: " + tipoFinal);
                location.reload();
            } catch (e) { 
                alert("Error de red al conectar con el servidor."); 
                document.getElementById("btnEjecutar").disabled = false;
                document.getElementById("btnEjecutar").innerText = "Finalizar Venta";
            }
        }

        async function buscarYReimprimir() {
            const dni = document.getElementById("dniBusqueda").value.trim();
            const resDiv = document.getElementById("resultadoBusqueda");
            if (!dni) return alert("Ingresa un DNI para buscar.");
            resDiv.innerHTML = "⏳ Buscando registros...";
            try {
                const res = await fetch(`${URL_APP}?dni=${dni}&t=${Date.now()}`);
                const ventas = await res.json();
                if (ventas.length === 0) { resDiv.innerHTML = "❌ No se encontraron compras para este DNI."; return; }
                resDiv.innerHTML = "";
                ventas.forEach(v => {
                    const card = document.createElement("div");
                    card.className = "ticket-card";
                    card.innerHTML = `
                        <strong>Venta #${v.nroVenta} - Zona: ${v.tipo}</strong><br>
                        Cliente: ${v.nombre}<br>
                        Entradas: ${v.asientos}<br>
                        <button onclick="reimprimir('${v.asientos}', ${v.inicio})" style="background:#2ecc71; border:none; padding:8px 12px; color:white; border-radius:5px; cursor:pointer; margin-top:10px; font-weight:bold;">📥 Descargar Tickets</button>
                    `;
                    resDiv.appendChild(card);
                });
            } catch (e) { resDiv.innerHTML = "❌ Error al conectar con la base de datos."; }
        }

        async function reimprimir(asientos, inicio) {
            const lista = asientos.split(",");
            let actual = parseInt(inicio);
            for (let a of lista) {
                let n = a.trim();
                if (n.includes("GENERAL")) {
                    let cant = n.match(/\d+/) ? parseInt(n.match(/\d+/)[0]) : 1;
                    for (let i = 0; i < cant; i++) {
                        await generarTicket("general.jpg", String(actual).padStart(5, "0"), "GENERAL");
                        actual++;
                    }
                } else {
                    await generarTicket("vip.jpg", String(actual).padStart(5, "0"), n);
                    actual++;
                }
            }
            alert("Descarga completa.");
        }

        function generarTicket(ruta, num, asiento) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = ruta;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    ctx.fillStyle = "white";
                    ctx.font = "bold 42px Arial";
                    ctx.fillText(num, img.width * 0.140, img.height * 0.115);
                    ctx.fillText(num, img.width * 0.865, img.height * 0.115);
                    ctx.textAlign = "center";
                    ctx.font = "bold 45px Arial";
                    ctx.fillText(asiento === "GENERAL" ? "GENERAL" : "ASIENTO: " + asiento, img.width * 0.872, img.height * 0.285);
                    const link = document.createElement("a");
                    link.download = `Ticket_${num}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    setTimeout(resolve, 600);
                };
            });
        }
        cargarDatos();
    </script>
</body>
</html>
